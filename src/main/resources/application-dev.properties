spring.datasource.username=${DATASOURCE_USERNAME:sa}
spring.datasource.password=${DATASOURCE_PASSWORD:t}
spring.h2.console.enabled=true
spring.h2.console.path=/h2
spring.datasource.url=${DATASOURCE_URL:jdbc:h2:mem:penguin}/${DATASOURCE_DBNAME}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.${DATASOURCE_TYPE:H2}Dialect
spring.jpa.show-sql=true
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.main.allow-bean-definition-overriding=true
jwt.secret = ${JWT_SECRET}
